name: CI

# Every PR must pass the data validator (spec §8.4) and build.
on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # `npm run build` runs the validator first.
      - run: npm run build
